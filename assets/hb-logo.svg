<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <!-- Matte Olive Background matching Business Card -->
  <rect width="600" height="420" fill="#3e4433" />
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="#d2ae68" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- HB Classical Fluted Column Monogram -->
  <g transform="translate(170, 28)" fill="#d2ae68">
    <!-- Top Abacus & Capital -->
    <rect x="103" y="20" width="54" height="5.5" rx="1.5" />
    <path d="M107 28.5 H153 L147 38.5 H113 Z" />
    <rect x="112" y="41.5" width="36" height="4" rx="1" />
    <!-- Fluted Column Shaft -->
    <rect x="115" y="48.5" width="5.5" height="126" />
    <rect x="123.2" y="48.5" width="5.5" height="126" />
    <rect x="131.3" y="48.5" width="5.5" height="126" />
    <rect x="139.5" y="48.5" width="5.5" height="126" />
    <!-- Column Base -->
    <rect x="112" y="177.5" width="36" height="4" rx="1" />
    <path d="M113 184.5 H147 L154 194.5 H106 Z" />
    <rect x="101" y="197.5" width="58" height="5.5" rx="1.5" />

    <!-- Left Serif H -->
    <rect x="36" y="48.5" width="34" height="5" />
    <rect x="47.5" y="53.5" width="11" height="116" />
    <rect x="36" y="169.5" width="34" height="5" />
    <rect x="58.5" y="105" width="56.5" height="7.5" />

    <!-- Right Serif B -->
    <path d="M145 48.5 H176 C199 48.5 213 60 213 77.5 C213 92.5 201.5 103.5 184 106.8 V107.2 C205.5 109.8 219 122.5 219 141.5 C219 161.5 202.5 174.5 175.5 174.5 H145 V168.5 H173 C194.5 168.5 206.5 157.5 206.5 141 C206.5 123.5 193.5 111.5 170 111.5 H145 V105 H171 C190.5 105 201 95.5 201 78.5 C201 62.5 190 54.5 172 54.5 H145 Z" />
  </g>

  <!-- Typography Lockup -->
  <text x="300" y="302" text-anchor="middle" fill="#d2ae68" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="40" font-weight="600" letter-spacing="5">HUBEYB BİLİCİ</text>
  <text x="300" y="340" text-anchor="middle" fill="#ffffff" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="19" font-weight="500" letter-spacing="3.5">AVUKAT <tspan fill="#d2ae68" font-weight="700">|</tspan> ATTORNEY AT LAW</text>
</svg>
